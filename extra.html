<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parker</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  background:#efe8e5;
  overflow-x:hidden;
}

/* CONTAINER */
.wrapper{
  width:95%;
  max-width:1400px;
  margin:40px auto;
  background:#e9f1f6;
  border-radius:28px;
  padding-bottom:60px;
  overflow:hidden;
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:25px 40px;
  animation:slideDown 1s ease;
}

@keyframes slideDown{
  from{opacity:0; transform:translateY(-40px);}
  to{opacity:1; transform:translateY(0);}
}

.logo{
  font-weight:700;
  font-size:20px;
  display:flex;
  gap:10px;
  align-items:center;
}

.logo span{
  width:20px;
  height:20px;
  background:orange;
  border-radius:50%;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.2);}
  100%{transform:scale(1);}
}

.menu{
  display:flex;
  gap:30px;
  align-items:center;
}

.menu a{
  text-decoration:none;
  color:#333;
  font-size:15px;
  position:relative;
}

.menu a::after{
  content:"";
  position:absolute;
  bottom:-5px;
  left:0;
  width:0%;
  height:2px;
  background:#ff6a1a;
  transition:.3s;
}

.menu a:hover::after{
  width:100%;
}

.btn{
  padding:12px 22px;
  border-radius:25px;
  border:none;
  cursor:pointer;
  font-weight:600;
  transition:.3s;
}

.contact{
  background:#fff;
}

.call{
  background:#ff6a1a;
  color:#fff;
}

.btn:hover{
  transform:translateY(-3px) scale(1.05);
  box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

/* HERO */
.hero{
  text-align:center;
  padding:40px 20px;
}

.hero h1{
  font-size:64px;
  font-weight:900;
  opacity:0;
  transform:translateY(40px);
  animation:textReveal 1s forwards .4s;
}

.hero h1 span{
  color:#2b64d8;
}

@keyframes textReveal{
  to{opacity:1; transform:translateY(0);}
}

.badges{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.badge{
  background:#fff;
  padding:10px 16px;
  border-radius:20px;
  font-size:14px;
  transition:.3s;
  opacity:0;
  transform:translateY(30px);
}

.badge.show{
  opacity:1;
  transform:translateY(0);
}

.badge:hover{
  transform:translateY(-6px) scale(1.05);
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* IMAGE CARD */
.image-card{
  margin:50px auto;
  width:85%;
  border-radius:25px;
  overflow:hidden;
  position:relative;
  transform:scale(.95);
  opacity:0;
  transition:1s;
}

.image-card.show{
  transform:scale(1);
  opacity:1;
}

.image-card img{
  width:100%;
  transition:1.5s;
}

.image-card:hover img{
  transform:scale(1.08);
}

.rating{
  position:absolute;
  left:30px;
  bottom:30px;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
  color:#fff;
  padding:20px;
  border-radius:20px;
  animation:float 4s infinite ease-in-out;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0);}
}

.details{
  position:absolute;
  right:30px;
  bottom:20px;
  display:flex;
  align-items:center;
  gap:10px;
}

.details button{
  background:#111;
  color:#fff;
  border:none;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
  transition:.3s;
}

.details button:hover{
  transform:scale(1.1);
}

.arrow{
  width:40px;
  height:40px;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  transition:.3s;
}

.arrow:hover{
  transform:rotate(45deg) scale(1.1);
}

/* RESPONSIVE */
@media(max-width:900px){
.hero h1{font-size:42px;}
.menu{display:none;}
}
</style>
</head>
<body>

<div class="wrapper">

<nav>
  <div class="logo"><span></span>Parker</div>

  <div class="menu">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Gallery</a>
    <a href="#">Blog</a>
    <button class="btn contact">Contact Us</button>
    <button class="btn call">📞 Schedule a Call</button>
  </div>
</nav>

<div class="hero">
  <h1>Year-Round <span>Comfort</span> Solution</h1>

  <div class="badges">
    <div class="badge">1k+ Users</div>
    <div class="badge">2.4k+ Reviews</div>
    <div class="badge">1.5k+ Project</div>
  </div>
</div>

<div class="image-card">
  <img src="https://images.unsplash.com/photo-1600566752355-35792bedcfea">

  <div class="rating">
    <strong>4.8</strong><br>Average Score
  </div>

  <div class="details">
    <button>Details</button>
    <div class="arrow">→</div>
  </div>
</div>

</div>

<script>
// stagger badges
setTimeout(()=>{
  document.querySelectorAll(".badge").forEach((b,i)=>{
    setTimeout(()=>b.classList.add("show"), i*200);
  });
},600);

// scroll reveal
const observer = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add("show");
    }
  });
});

observer.observe(document.querySelector(".image-card"));
</script>

</body>
</html>
